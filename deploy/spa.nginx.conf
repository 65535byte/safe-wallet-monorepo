# Include inside the existing server block serving this project's dist directory.
# Keep the site's existing /api/ upstream configuration.
# Exact matches also fix deployments where the previous assets directory remains.
location = /assets {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}
location = /assets/ {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}

location ^~ /static/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location = /index.html {
    add_header Cache-Control "no-cache";
}

# Replace an existing location / block with this block; do not duplicate it.
location / {
    try_files $uri $uri/ /index.html;
}
