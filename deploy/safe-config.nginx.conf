# Include inside the Web site's server block when hosting the production build.
# Build with VITE_SAFE_CONFIG_URL=/api/config/safe to use this same-origin route.
location = /api/config/safe {
    proxy_pass https://msw.dplife.org/api/config/safe;
    proxy_ssl_server_name on;
    proxy_set_header Host msw.dplife.org;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}
